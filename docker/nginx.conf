# NWIS frontend server.
#
# Serves the SPA and proxies the API and WebSocket to the backend on the same origin.
# Same-origin means the browser makes no cross-origin request, so CORS is not involved in
# production at all and no wildcard origin is ever needed.

upstream nwis_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Drilling reports and telemetry payloads compress well.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Conservative security headers. No CDN is used: scripts, styles and fonts are all
    # bundled and served from this origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; index.html must never be cached or a deploy
    # would keep serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://nwis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Model training and document ingestion are batch jobs, but analogue ranking over
        # a large well set can still take a few seconds.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://nwis_api;
        proxy_set_header Host $host;
    }

    # Telemetry replay stream. The connection stays open for the length of a replay, so
    # the read timeout must be long and the upgrade headers must be forwarded.
    location /ws/ {
        proxy_pass http://nwis_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA routing: unknown paths resolve to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
