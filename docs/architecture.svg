<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="700" fill="#ffffff"/>

  <text x="40" y="42" font-size="20" font-weight="600" fill="#111827">NWIS — Nearby Wells Intelligence System</text>
  <text x="40" y="64" font-size="13" fill="#6b7280">SIH 2026 · PS 26121 · every value traceable to a measurement</text>

  <text x="40" y="100" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1">DATA SOURCES — real, public</text>
  <g>
    <rect x="40" y="110" width="260" height="58" rx="6" fill="#fdf0eb" stroke="#d85a30" stroke-width="1"/>
    <text x="170" y="134" font-size="14" font-weight="600" fill="#993c1d" text-anchor="middle">FORCE 2020</text>
    <text x="170" y="154" font-size="12" fill="#b4532c" text-anchor="middle">98 wells · wireline logs · 90 features</text>

    <rect x="320" y="110" width="260" height="58" rx="6" fill="#fdf0eb" stroke="#d85a30" stroke-width="1"/>
    <text x="450" y="134" font-size="14" font-weight="600" fill="#993c1d" text-anchor="middle">Volve WITSML</text>
    <text x="450" y="154" font-size="12" fill="#b4532c" text-anchor="middle">3 wells · 86,800 samples · 20 channels</text>

    <rect x="600" y="110" width="260" height="58" rx="6" fill="#fdf0eb" stroke="#d85a30" stroke-width="1"/>
    <text x="730" y="134" font-size="14" font-weight="600" fill="#993c1d" text-anchor="middle">Sodir reports + NPD</text>
    <text x="730" y="154" font-size="12" fill="#b4532c" text-anchor="middle">429 pages OCR'd · coordinates</text>
  </g>

  <path d="M170 168 L170 196" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M450 168 L450 196" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M730 168 L730 196" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <text x="40" y="192" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1">INGESTION</text>
  <rect x="40" y="200" width="820" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="450" y="222" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Pipelines</text>
  <text x="450" y="240" font-size="12" fill="#6b7280" text-anchor="middle">force/prepare · volve WITSML parser · documents: OCR → NLP extraction → embed</text>

  <path d="M450 252 L450 280" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <text x="40" y="276" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1">STORAGE</text>
  <rect x="40" y="284" width="820" height="52" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="450" y="306" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">16 tables</text>
  <text x="450" y="324" font-size="12" fill="#6b7280" text-anchor="middle">PostgreSQL + PostGIS + TimescaleDB + pgvector · SQLite fallback, reported honestly in the UI</text>

  <path d="M145 336 L145 372" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M348 336 L348 372" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M552 336 L552 372" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M755 336 L755 372" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <text x="40" y="368" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1">TRAINED MODELS — measured, never hand-written</text>
  <g>
    <rect x="40" y="376" width="210" height="58" rx="6" fill="#efedfd" stroke="#7f77dd" stroke-width="1"/>
    <text x="145" y="400" font-size="14" font-weight="600" fill="#3c3489" text-anchor="middle">Lithology</text>
    <text x="145" y="419" font-size="12" fill="#534ab7" text-anchor="middle">RF / XGBoost · 18,842 stored</text>

    <rect x="263" y="376" width="170" height="58" rx="6" fill="#efedfd" stroke="#7f77dd" stroke-width="1"/>
    <text x="348" y="400" font-size="14" font-weight="600" fill="#3c3489" text-anchor="middle">Anomaly</text>
    <text x="348" y="419" font-size="12" fill="#534ab7" text-anchor="middle">Isolation forest · 8,130</text>

    <rect x="446" y="376" width="213" height="58" rx="6" fill="#efedfd" stroke="#7f77dd" stroke-width="1"/>
    <text x="552" y="400" font-size="14" font-weight="600" fill="#3c3489" text-anchor="middle">Segment embeddings</text>
    <text x="552" y="419" font-size="12" fill="#534ab7" text-anchor="middle">3,620 × 32 interpretable dims</text>

    <rect x="672" y="376" width="188" height="58" rx="6" fill="#efedfd" stroke="#7f77dd" stroke-width="1"/>
    <text x="766" y="400" font-size="14" font-weight="600" fill="#3c3489" text-anchor="middle">Passage embeddings</text>
    <text x="766" y="419" font-size="12" fill="#534ab7" text-anchor="middle">562 × 384 (MiniLM)</text>
  </g>

  <path d="M145 434 L145 470" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M348 434 L348 470" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M552 434 L552 470" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M755 434 L755 470" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <text x="40" y="466" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1">SERVICES</text>
  <g>
    <rect x="40" y="474" width="210" height="58" rx="6" fill="#e3f6f0" stroke="#1d9e75" stroke-width="1"/>
    <text x="145" y="498" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Risk engine</text>
    <text x="145" y="517" font-size="12" fill="#0f6e56" text-anchor="middle">hybrid indicator · no fake p</text>

    <rect x="263" y="474" width="170" height="58" rx="6" fill="#e3f6f0" stroke="#1d9e75" stroke-width="1"/>
    <text x="348" y="498" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Replay</text>
    <text x="348" y="517" font-size="12" fill="#0f6e56" text-anchor="middle">server-owned state</text>

    <rect x="446" y="474" width="213" height="58" rx="6" fill="#e3f6f0" stroke="#1d9e75" stroke-width="1"/>
    <text x="552" y="498" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Analogue engine</text>
    <text x="552" y="517" font-size="12" fill="#0f6e56" text-anchor="middle">5 weighted dimensions</text>

    <rect x="672" y="474" width="188" height="58" rx="6" fill="#e3f6f0" stroke="#1d9e75" stroke-width="1"/>
    <text x="766" y="498" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Report search</text>
    <text x="766" y="517" font-size="12" fill="#0f6e56" text-anchor="middle">cited passages only</text>
  </g>

  <path d="M450 532 L450 560" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <rect x="40" y="564" width="820" height="48" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="450" y="584" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">FastAPI</text>
  <text x="450" y="602" font-size="12" fill="#6b7280" text-anchor="middle">28 REST endpoints + /ws/telemetry WebSocket · OpenAPI at /docs</text>

  <path d="M450 612 L450 634" stroke="#9ca3af" stroke-width="1.2" fill="none" marker-end="url(#a)"/>

  <rect x="40" y="638" width="820" height="48" rx="6" fill="#e8f1fb" stroke="#378add" stroke-width="1"/>
  <text x="450" y="658" font-size="14" font-weight="600" fill="#0c447c" text-anchor="middle">React + TypeScript dashboard</text>
  <text x="450" y="676" font-size="12" fill="#185fa5" text-anchor="middle">Overview · Wells · Active well · Alerts · Explanation · Reports · Models — every value via the API</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
