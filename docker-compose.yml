# NWIS full stack.
#
#   docker compose up --build
#
# Brings up PostgreSQL with PostGIS, TimescaleDB and pgvector, the FastAPI backend and the
# React frontend. When this stack is running the backend uses the real extensions; without
# it the backend falls back to the local storage backend and says so in /api/status.
#
# Secrets come from .env (copy .env.example). Nothing is hardcoded here.

services:
  database:
    build:
      context: ./docker/postgres
    container_name: nwis-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nwis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nwis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nwis-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nwis} -d ${POSTGRES_DB:-nwis}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: nwis-api
    depends_on:
      database:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    environment:
      NWIS_ENV: ${NWIS_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nwis}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-nwis}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # With a real Postgres stack available, refuse to silently fall back.
      NWIS__DATABASE__ALLOW_FALLBACK: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Models and processed data are build artefacts, mounted rather than baked in.
      - ./artifacts:/app/artifacts:ro
      - ./data/processed:/app/data/processed:ro
    restart: unless-stopped

  # One-shot: create the schema, load the knowledge base, then exit. The backend waits
  # for this to complete successfully, so `docker compose up` yields a populated stack
  # rather than an empty database.
  #
  # Order is deliberate. `load_database --reset` calls drop_all, so it must run BEFORE
  # the migration, not after — otherwise it drops the hypertable and the GIST/ivfflat
  # indexes the migration just created.
  #
  # The migration step is best-effort: the hypertable and vector indexes are performance
  # features, not correctness ones. If TimescaleDB rejects the conversion the stack still
  # serves correct results, and /api/status reports which backends are actually active
  # instead of claiming all of them.
  loader:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: nwis-loader
    depends_on:
      database:
        condition: service_healthy
    environment:
      NWIS_ENV: ${NWIS_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nwis}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-nwis}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NWIS__DATABASE__ALLOW_FALLBACK: "false"
    volumes:
      # Read-only except artifacts, which the prediction step writes a report into.
      - ./artifacts:/app/artifacts
      - ./data:/app/data:ro
    command:
      - sh
      - -c
      - |
        set -e
        python -m data_pipeline.load_database --reset
        alembic -c backend/alembic.ini upgrade head \
          || echo "migration extras unavailable; continuing without hypertable/vector indexes"
        python -m data_pipeline.load_embeddings
        python -m data_pipeline.load_anomaly_scores
        python -m ml.lithology.predict
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Empty by default: nginx proxies /api and /ws to the backend on the same
        # origin, so the browser makes no cross-origin request and CORS is not used.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    container_name: nwis-web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  nwis-db-data:
