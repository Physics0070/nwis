# NWIS base configuration.
# Every tunable value in the system lives here or in an environment override.
# No thresholds, weights, window sizes or K values may be hardcoded in application code.

app:
  name: "NWIS — Nearby Wells Intelligence System"
  environment: "development"

logging:
  level: "INFO"
  format: "json"          # json | console
  sql_echo: false

database:
  # Real target stack. DATABASE_URL env var overrides this entirely.
  url: "postgresql+psycopg://nwis:nwis@localhost:5432/nwis"
  # Local fallback used when the Postgres stack is unavailable (see docs/ASSUMPTIONS.md).
  fallback_url: "sqlite+pysqlite:///./data/nwis.db"
  allow_fallback: true
  pool_size: 5
  max_overflow: 10
  statement_timeout_seconds: 30
  # Keep the probe short: if the Postgres stack is not up, fall back promptly rather
  # than stalling API startup on an OS-level connect timeout.
  connect_timeout_seconds: 3

api:
  host: "0.0.0.0"
  port: 8000
  root_path: ""
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  default_page_size: 50
  max_page_size: 500

paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_processed: "data/processed"
  data_external: "data/external"
  artifacts: "artifacts"
  models: "artifacts/models"

datasets:
  force:
    # Official FORCE 2020 lithology competition data.
    source_repo: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition"
    raw_dir: "data/raw/force2020"
    files:
      train_zip: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/train.zip"
      test_features: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/leaderboard_test_features.csv"
      test_target: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/leaderboard_test_target.csv"
      penalty_matrix: "https://github.com/bolgebrygg/Force-2020-Machine-Learning-competition/raw/master/lithology_competition/data/penalty_matrix.npy"
    csv_separator: ";"
  volve:
    # Public Volve WITSML mirror (Equinor open data licence).
    source_repo: "https://github.com/f0nzie/volve-drilling"
    raw_dir: "data/raw/volve"
    witsml_subdir: "witsml"
  npd:
    # Norwegian Offshore Directorate factpages — public wellbore coordinates.
    # Full export requires Top100=false; without it the endpoint returns only 300 rows.
    # UTM zone 31, ED50 - the same CRS family as the FORCE coordinates.
    wellbore_development_csv: "https://factpages.sodir.no/public?/Factpages/external/tableview/wellbore_development_all&rs:Command=Render&rc:Toolbar=false&rc:Parameters=f&Top100=false&IpAddress=1.1.1.1&CultureCode=en&rs:Format=CSV"
    wellbore_exploration_csv: "https://factpages.sodir.no/public?/Factpages/external/tableview/wellbore_exploration_all&rs:Command=Render&rc:Toolbar=false&rc:Parameters=f&Top100=false&IpAddress=1.1.1.1&CultureCode=en&rs:Format=CSV"
    name_column: "wlbWellboreName"
    northing_column: "wlbNsUtm"
    easting_column: "wlbEwUtm"
    utm_zone_column: "wlbUtmZone"
    source_crs: "EPSG:23031"
    raw_dir: "data/raw/npd"

ingestion:
  # Raw FORCE logs are sampled every 0.152 m (1.17 M rows). That is far finer than any
  # display or depth lookup needs, so samples are decimated on the way into the database.
  # Full resolution stays in data/processed for model training.
  log_depth_step_m: 5.0
  # Curves stored per log sample. Chosen from measured coverage in the profiling report.
  log_curves: ["GR", "RHOB", "NPHI", "DTC", "RDEP", "RMED", "CALI", "PEF", "SP", "DRHO"]
  # Telemetry is already resampled by the Volve pipeline; loaded as-is.

profiling:
  max_example_values: 10
  missingness_report_top_n: 40

data_quality:
  # Physically implausible readings are flagged (never silently dropped).
  null_sentinels: [-999.25, -999.0, -9999.0]
  depth_monotonic_tolerance_m: 0.5
  max_duplicate_depth_fraction: 0.02
  coordinate_bounds:
    lat_min: -90.0
    lat_max: 90.0
    lon_min: -180.0
    lon_max: 180.0

force_pipeline:
  # Column names are resolved from the profiling report at runtime, never assumed.
  target_column: "FORCE_2020_LITHOFACIES_LITHOLOGY"
  well_column: "WELL"
  depth_column: "DEPTH_MD"
  group_column: "GROUP"
  formation_column: "FORMATION"
  min_rows_per_well: 100
  min_curve_coverage: 0.30      # a curve is usable if present in >= this fraction of rows

  # Columns that must never become model features.
  #   *_LITHOFACIES_*  : the label and its annotation-confidence flag (leakage)
  #   X_LOC / Y_LOC    : absolute map position. Including them lets the model memorise
  #                      geography instead of petrophysics — scores inflate on nearby
  #                      wells and collapse on new areas. Z_LOC (true vertical depth)
  #                      is retained because depth is genuine petrophysical context.
  excluded_features:
    - "FORCE_2020_LITHOFACIES_LITHOLOGY"
    - "FORCE_2020_LITHOFACIES_CONFIDENCE"
    - "X_LOC"
    - "Y_LOC"

  # CRS of X_LOC/Y_LOC: Norwegian North Sea sector, ED50 / UTM zone 31N.
  # Transformed to WGS84 before any value reaches the map.
  source_crs: "EPSG:23031"
  target_crs: "EPSG:4326"

  split:
    strategy: "well_level"      # rows of a well never cross splits
    train_fraction: 0.70
    validation_fraction: 0.15
    test_fraction: 0.15
    random_seed: 42
    # Rare lithologies occur in very few wells (Basement: 103 rows dataset-wide).
    # Greedily place scarce-class wells first so each split keeps what coverage exists.
    stratify_by_class_presence: true
    # Only classes appearing in this many wells or fewer are actively spread across
    # splits. Common lithologies reach every split unaided; forcing them would
    # override the split sizes above.
    rare_class_max_wells: 15
  features:
    depth_derived: true
    rolling_windows_m: [5.0, 15.0]
    rolling_statistics: ["mean", "std"]
    gradient: true

lithology_model:
  candidates: ["random_forest", "xgboost"]

  # Baseline, CPU only (scikit-learn has no GPU path). Kept deliberately light:
  # the first attempt at 300 trees / min_samples_leaf 5 took 10.1 hours and produced a
  # 901 MB artifact, which is not reproducible on a laptop. Larger leaves cut both
  # dramatically. Measured cost is recorded in every registry entry.
  random_forest:
    n_estimators: 150
    max_depth: 18
    min_samples_leaf: 25
    class_weight: "balanced_subsample"
    n_jobs: -1
    random_state: 42

  # Primary model. Runs on the GPU when one is present.
  xgboost:
    n_estimators: 2000          # an upper bound; early stopping decides the real count
    max_depth: 10
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 1.0
    random_state: 42
    # Reweight rows so rare lithologies count. Mirrors the RandomForest's
    # class_weight="balanced_subsample". Set to "none" to train on raw frequencies.
    class_balancing: "balanced"
    # Stop once validation loss stops improving instead of always running the full
    # round budget. Validation wells are never used for fitting.
    early_stopping_rounds: 50

  # "auto" uses the GPU when XGBoost can reach one and silently falls back to CPU
  # otherwise, so the pipeline runs on any machine. Force with "cuda" or "cpu".
  device: "auto"

  min_class_support: 50         # classes below this are reported separately, not dropped silently

volve_pipeline:
  # Log objects to ingest, resolved against what the WITSML files actually contain.
  # CementData / GasTime / Pits are separate operations and are excluded from the
  # drilling telemetry stream.
  preferred_log_names: ["GenTime", "GenTime2", "GwdTime", "Hydraulics"]
  index_type: "date time"
  resample_seconds: 10
  min_valid_fraction: 0.10
  unit_conversions:
    enabled: true

  # Canonical telemetry channel <- first matching WITSML mnemonic.
  # Verified present in all three wells; resolved at runtime against each log, so a
  # missing mnemonic degrades that channel to null instead of failing the pipeline.
  channel_map:
    hole_depth_m:            ["Depth", "MDEPTH"]
    bit_depth_m:             ["BITDEP"]
    rop_m_per_hr:            ["ROP_AVG"]
    weight_on_bit_kn:        ["WOB_AVG", "WOB"]
    surface_torque_knm:      ["TORQUE_AVG"]
    surface_rpm:             ["SURF_RPM"]
    bit_rpm:                 ["BIT_RPM_AVG", "BIT_RPM"]
    standpipe_pressure_bar:  ["PUMP", "PUMP2"]
    flow_in_lpm:             ["FLOWIN"]
    flow_out_lpm:            ["FLOWOUT"]
    hookload_kn:             ["HKLD_AVG", "HKLD"]
    mse_bar:                 ["MSE", "I_MSE"]
    mud_weight_in_sg:        ["MWIN"]
    mud_weight_out_sg:       ["MWOUT"]
    pit_gain_loss_m3:        ["GAINLOSSTOT"]
    total_gas:               ["TOTGAS"]
    mud_temp_in_c:           ["MTIN"]
    mud_temp_out_c:          ["MTOUT"]
    block_position_m:        ["BLOCKCOMP"]
    rig_activity_code:       ["RigActivityCode"]

  # Zero is an operational state in this dataset (pumps off, string static), not a null,
  # so zeros are never blanket-removed. Activity is expressed as explicit flags.
  #
  # Measured fact about this mirror: the `Depth` channel is a CONSTANT equal to wellbore
  # total depth, not live hole depth, so an on-bottom test is not derivable. Activity is
  # therefore inferred from signals that genuinely vary: flow, rotation and string
  # movement. See docs/ASSUMPTIONS.md A10.
  activity:
    min_flow_in_lpm: 100.0
    min_bit_rpm: 5.0
    min_trip_speed_m_per_min: 0.5    # absolute rate of change of bit depth
    # A row counts as operationally active if ANY of these hold.
    active_states: ["circulating", "rotating", "tripping"]
    # A channel whose values never change carries no information and is reported.
    constant_channel_tolerance: 1.0e-9

  # Values outside these ranges are physically implausible; they are flagged and
  # counted in the quality report, never silently deleted.
  plausible_ranges:
    hole_depth_m:           [0.0, 10000.0]
    bit_depth_m:            [0.0, 10000.0]
    rop_m_per_hr:           [0.0, 500.0]
    weight_on_bit_kn:       [-50.0, 500.0]
    surface_torque_knm:     [-5.0, 100.0]
    surface_rpm:            [0.0, 350.0]
    bit_rpm:                [0.0, 400.0]
    standpipe_pressure_bar: [0.0, 700.0]
    flow_in_lpm:            [0.0, 10000.0]
    flow_out_lpm:           [0.0, 10000.0]
    hookload_kn:            [0.0, 5000.0]
    mud_weight_in_sg:       [0.8, 3.0]
    mud_weight_out_sg:      [0.8, 3.0]
    mud_temp_in_c:          [-10.0, 150.0]
    mud_temp_out_c:         [-10.0, 150.0]
    trip_speed_m_per_min:   [0.0, 90.0]      # faster than any real hoisting speed

telemetry:
  # Rolling windows expressed in samples at the resampled rate above.
  rolling_windows:
    short: 6
    medium: 30
    long: 90
  statistics: ["mean", "std", "slope"]
  rate_of_change: true
  min_samples_for_features: 90

anomaly:
  model: "isolation_forest"
  isolation_forest:
    n_estimators: 200
    contamination: 0.02
    max_samples: "auto"
    random_state: 42
  score_smoothing_window: 5
  attribution_top_n: 5

analogue:
  top_k: 5
  candidate_pool: 50

  # Segment embedding. Dimensions = curves x statistics + 2 depth terms.
  # 10 curves x 3 statistics (mean, std, median) + thickness + mid-depth = 32.
  # Every dimension is a named petrophysical statistic, so a match can be explained.
  embedding_dim: 32
  embedding_curves: ["GR", "RHOB", "NPHI", "DTC", "RDEP", "RMED", "CALI", "PEF", "SP", "DRHO"]
  segment_length_m: 100.0
  segment_stride_m: 50.0        # overlapping windows so a query never falls between segments
  min_samples_per_segment: 50
  depth_scale_m: 5000.0         # normalises depth terms into roughly unit range
  feature_clip_sigma: 5.0       # bounds outliers so one absurd reading cannot dominate
  weights:
    geology: 0.30
    formation: 0.20
    depth: 0.15
    drilling_behaviour: 0.20
    geography: 0.15
  geography:
    search_radius_km: 50.0
    distance_decay_km: 25.0
  depth:
    tolerance_m: 300.0

  # Channels compared when scoring drilling-behaviour similarity, with the scale over
  # which a difference is considered large. Only channels present in BOTH wells count.
  behaviour_channels: ["standpipe_pressure_bar", "flow_in_lpm", "hookload_kn",
                       "surface_torque_knm", "bit_rpm", "weight_on_bit_kn"]
  behaviour_scales:
    standpipe_pressure_bar: 50.0
    flow_in_lpm: 800.0
    hookload_kn: 300.0
    surface_torque_knm: 5.0
    bit_rpm: 30.0
    weight_on_bit_kn: 50.0

risk:
  mode: "auto"                  # auto | supervised | hybrid_indicator
  min_labelled_events_for_supervised: 200
  weights:
    anomaly: 0.40
    historical_evidence: 0.40
    rules: 0.20
  lookahead_m: 150.0            # distance ahead of bit to consider historical intervals
  evidence:
    min_analogue_similarity: 0.50
    min_supporting_wells: 1

alerts:
  thresholds:                   # applied to combined risk score in [0, 1]
    INFO: 0.0
    LOW: 0.25
    MEDIUM: 0.45
    HIGH: 0.65
    CRITICAL: 0.85
  cooldown_seconds: 300
  dedupe_depth_window_m: 25.0
  max_active_alerts_per_well: 20

replay:
  default_speed: 60.0           # simulated seconds per wall-clock second
  min_speed: 1.0
  max_speed: 3600.0
  tick_interval_seconds: 1.0
  autostart: false

embeddings:
  text_model: "sentence-transformers/all-MiniLM-L6-v2"
  enabled: true
  batch_size: 32

documents:
  ocr:
    enabled: true
    tesseract_cmd: null         # null = use PATH
    language: "eng"
    dpi: 300
  nlp:
    spacy_model: "en_core_web_sm"
    min_confidence: 0.35
  chunk:
    size_chars: 1200
    overlap_chars: 150
